name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.5)"
        required: true
        default: "v0.1.5"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    env:
      RESEAM_BIN: ${{ github.workspace }}/engine/reseam
      RESEAM_BUNDLE_KEY: ${{ github.workspace }}/bundle-signing.key
      RELEASE_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Full history, so the release notes can list the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare tag for release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (use a tag such as v0.1.5)." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install the Reseam CLI and signing key
        run: |
          mkdir -p engine
          version=$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' settings.gradle.kts)
          test -n "$version"
          echo "RESEAM_ENGINE_VERSION=$version" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 -o engine/reseam "https://cdn.reseam.app/engine/v${version}/reseam-linux-x64"
          chmod +x engine/reseam
          echo "${{ secrets.BUNDLE_SIGNING_KEY_B64 }}" | base64 -d > bundle-signing.key

      - name: Build the bundle
        run: ./gradlew bundle -PreleaseTag="$RELEASE_TAG" --no-daemon

      - name: Verify bundle engine version before publishing
        shell: bash
        run: |
          set -euo pipefail
          python - "$RESEAM_ENGINE_VERSION" build/reseam/rj-reseam-patches.reseam <<'PY'
          import sys, tomllib, zipfile
          expected = sys.argv[1]
          with zipfile.ZipFile(sys.argv[2]) as archive:
              manifest = tomllib.loads(archive.read("manifest.toml").decode("utf-8"))
          actual = manifest.get("bundle", {}).get("engine")
          if actual != expected:
              raise SystemExit(f"Bundle engine mismatch: expected {expected}, got {actual}")
          print(f"Verified bundle engine: {actual}")
          PY

      - name: Publish the release
        run: engine/reseam release patches build/reseam/*.reseam --tag "$RELEASE_TAG"
