name: inspect-hyperlock-archive

on:
  push:
    branches: [work/hyperlock-analysis]
    paths:
      - ".github/workflows/hyperlock-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hyperlock-analysis
      - name: Download and verify HyperLock release archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/visionxstream99-mod/RJ-reseam-patches/releases/download/apk/HyperLock-Screen-AOD_0.1.2_apkcube.zip"
          curl -fL --retry 2 "$url" -o "$RUNNER_TEMP/hyperlock.zip"
          echo "63aec7722410be0f3eb00fbdc54f54df2b986777de2cdd1d482c759ade02876b  $RUNNER_TEMP/hyperlock.zip" | sha256sum -c -
      - name: Inventory archive without extracting it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis
          python3 - "$RUNNER_TEMP/hyperlock.zip" analysis/hyperlock-archive-inventory.md <<'PY'
          import collections, hashlib, sys, zipfile
          from pathlib import Path
          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          z = zipfile.ZipFile(archive)
          entries = z.infolist()
          ext_counts = collections.Counter(Path(x.filename).suffix.lower() or "(no extension)" for x in entries if not x.is_dir())
          lines = [
              "HyperLock APKCube archive inventory",
              "",
              "Archive size: {:,} bytes".format(archive.stat().st_size),
              "SHA-256: {}".format(digest),
              "ZIP entries: {}".format(len(entries)),
              "",
              "File extensions:",
          ]
          for ext, count in ext_counts.most_common():
              lines.append("{}: {}".format(ext, count))
          lines += ["", "Archive paths (first 500 entries):"]
          for item in entries[:500]:
              lines.append("{} — {:,} bytes".format(item.filename, item.file_size))
          lines += ["", "Candidate nested archives and APKs:"]
          candidates = [x for x in entries if Path(x.filename).suffix.lower() in {".apk", ".xapk", ".apks", ".zip", ".apkcube", ".jar", ".aar", ".dex"}]
          for item in candidates[:500]:
              lines.append("{} — {:,} bytes".format(item.filename, item.file_size))
          output.write_text("\n".join(lines) + "\n")
          print("Wrote {} ({} entries)".format(output, len(entries)))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/hyperlock-archive-inventory.md
          git commit -m "chore: inventory HyperLock source archive [skip ci]"
          git push origin "HEAD:work/hyperlock-analysis"
