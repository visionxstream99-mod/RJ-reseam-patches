name: validate-patches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install matching Reseam CLI and temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' settings.gradle.kts)"
          test -n "$version"
          mkdir -p "$RUNNER_TEMP/reseam"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/reseam/reseam" "https://cdn.reseam.app/engine/v${version}/reseam-linux-x64"
          chmod +x "$RUNNER_TEMP/reseam/reseam"
          "$RUNNER_TEMP/reseam/reseam" bundle keygen --out "$RUNNER_TEMP/reseam/test-bundle-signing.key"
          echo "RESEAM_BIN=$RUNNER_TEMP/reseam/reseam" >> "$GITHUB_ENV"
          echo "RESEAM_BUNDLE_KEY=$RUNNER_TEMP/reseam/test-bundle-signing.key" >> "$GITHUB_ENV"

      - name: Build the signed bundle with a one-run test key
        run: ./gradlew bundle --no-daemon

      - name: Verify signed bundle manifest and required patch IDs
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/reseam/rj-reseam-patches.reseam"
          test -s "$bundle"
          pubkey="$(python -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("manifest.pubkey").hex())' "$bundle")"
          test "${#pubkey}" -eq 64
          python - "$bundle" <<'PY'
          import sys, tomllib, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              manifest = tomllib.loads(archive.read("manifest.toml").decode("utf-8"))
          expected = {
              "app.rj.adm.patches.removeAds",
              "app.rj.anixart.patches.removeAds",
              "app.rj.pinterest.patches.removeAdvertisingIdPermission",
              "app.rj.pinterest.patches.optOutGoogleAnalytics",
              "app.rj.pinterest.patches.disablePrivacySandboxAdServices",
              "app.rj.pinterest.patches.disableGoogleEngageReceiver",
          }
          actual = {patch["id"] for patch in manifest.get("patches", [])}
          missing = expected - actual
          if missing:
              raise SystemExit("Missing patch IDs: " + ", ".join(sorted(missing)))
          print("Verified patch IDs:")
          for patch_id in sorted(expected):
              print("  " + patch_id)
          PY
          "$RESEAM_BIN" bundle list "$bundle" --trust "$pubkey"

      - name: Fetch Pinterest 14.42.0 target APK set
        shell: bash
        run: |
          set -euo pipefail
          target_zip="$RUNNER_TEMP/pinterest-14.42.0.zip"
          target_dir="$RUNNER_TEMP/pinterest-14.42.0"
          curl -fL --retry 3 --retry-delay 2 -o "$target_zip" "https://github.com/visionxstream99-mod/RJ-reseam-patches/releases/download/apk/com.pinterest_14.42.0-14428010_1arch_2dpi_23lang_ea20959c6cbd20864956767ff91a0a32_apkmirror.com.zip"
          mkdir -p "$target_dir"
          python - "$target_zip" "$target_dir" <<'PY'
          import os, sys, zipfile
          source, dest = sys.argv[1:3]
          with zipfile.ZipFile(source) as archive:
              names = archive.namelist()
              apk_names = [name for name in names if name.lower().endswith('.apk') and not name.endswith('/')]
              print('Release archive entries:')
              for name in names[:60]:
                  print('  ' + name)
              bases = [name for name in apk_names if os.path.basename(name) == 'base.apk']
              if len(bases) != 1:
                  raise SystemExit(f'Expected one base.apk in release ZIP, found {len(bases)}; cannot safely dry-run this package')
              for name in apk_names:
                  destination = os.path.join(dest, os.path.basename(name))
                  if os.path.exists(destination):
                      raise SystemExit('Duplicate APK basename in source archive: ' + os.path.basename(name))
                  with archive.open(name) as src, open(destination, 'wb') as out:
                      while chunk := src.read(1024 * 1024):
                          out.write(chunk)
          PY
          base="$target_dir/base.apk"
          actual_base_sha="$(sha256sum "$base" | cut -d ' ' -f 1)"
          expected_base_sha="88a4f5685a0aec4c8b51219b270a46c9b7baac589d25fa82e6ff26daf7478845"
          echo "Pinterest base.apk SHA-256: $actual_base_sha"
          test "$actual_base_sha" = "$expected_base_sha"
          echo "PINTEREST_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"

      - name: Apply Pinterest patches to exact target and validate output
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/reseam/rj-reseam-patches.reseam"
          pubkey="$(python -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("manifest.pubkey").hex())' "$bundle")"
          base="$PINTEREST_TARGET_DIR/base.apk"
          output="$RUNNER_TEMP/patched-pinterest-14.42.0"
          "$RESEAM_BIN" info "$base"
          mapfile -t splits < <(find "$PINTEREST_TARGET_DIR" -maxdepth 1 -type f -name '*.apk' ! -name 'base.apk' | sort)
          args=("$RESEAM_BIN" patch "$base" --bundle "$bundle" --trust "$pubkey" --output-dir "$output")
          args+=(--enable app.rj.pinterest.patches.removeAdvertisingIdPermission)
          args+=(--enable app.rj.pinterest.patches.optOutGoogleAnalytics)
          args+=(--enable app.rj.pinterest.patches.disablePrivacySandboxAdServices)
          args+=(--enable app.rj.pinterest.patches.disableGoogleEngageReceiver)
          for split in "${splits[@]}"; do args+=(--split "$split"); done
          "${args[@]}"
          test -s "$output/base.apk"
          "$RESEAM_BIN" info "$output/base.apk"
          echo "Applied four Pinterest patches to the inspected 14.42.0 base APK and created the split output set."

      - name: Preserve diagnostics when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reseam-build-outputs
          path: |
            build/reports/
            build/reseam/
          if-no-files-found: ignore
          retention-days: 7
