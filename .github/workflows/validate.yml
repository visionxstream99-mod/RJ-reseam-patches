name: validate-patches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install matching Reseam CLI and temporary signing key
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' settings.gradle.kts)"
          test -n "$version"
          mkdir -p "$RUNNER_TEMP/reseam"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/reseam/reseam" "https://cdn.reseam.app/engine/v${version}/reseam-linux-x64"
          chmod +x "$RUNNER_TEMP/reseam/reseam"
          "$RUNNER_TEMP/reseam/reseam" bundle keygen --out "$RUNNER_TEMP/reseam/test-bundle-signing.key"
          echo "RESEAM_BIN=$RUNNER_TEMP/reseam/reseam" >> "$GITHUB_ENV"
          echo "RESEAM_BUNDLE_KEY=$RUNNER_TEMP/reseam/test-bundle-signing.key" >> "$GITHUB_ENV"

      - name: Build the signed bundle with a one-run test key
        run: ./gradlew bundle --no-daemon

      - name: Verify signed bundle manifest and required patch IDs
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/reseam/rj-reseam-patches.reseam"
          test -s "$bundle"
          pubkey="$(python -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("manifest.pubkey").hex())' "$bundle")"
          test "${#pubkey}" -eq 64
          python - "$bundle" <<'PY'
          import sys, tomllib, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              manifest = tomllib.loads(archive.read("manifest.toml").decode("utf-8"))
          expected = {
              "app.rj.adm.patches.removeAds",
              "app.rj.anixart.patches.removeAds",
              "app.rj.pinterest.patches.removeAdvertisingIdPermission",
              "app.rj.pinterest.patches.optOutGoogleAnalytics",
              "app.rj.pinterest.patches.disablePrivacySandboxAdServices",
              "app.rj.pinterest.patches.disableGoogleEngageReceiver",
          }
          actual = {patch["id"] for patch in manifest.get("patches", [])}
          missing = expected - actual
          if missing:
              raise SystemExit("Missing patch IDs: " + ", ".join(sorted(missing)))
          print("Verified patch IDs:")
          for patch_id in sorted(expected):
              print("  " + patch_id)
          PY
          "$RESEAM_BIN" bundle list "$bundle" --trust "$pubkey"

      - name: Fetch Pinterest 14.42.0 APKM target
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pinterest-14.42.0.apkm"
          curl -fL --retry 3 --retry-delay 2 -o "$target" "https://github.com/visionxstream99-mod/RJ-reseam-patches/releases/download/apk/com.pinterest_14.42.0-14428010_1arch_2dpi_23lang_ea20959c6cbd20864956767ff91a0a32_apkmirror.com.zip"
          python - "$target" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              if "base.apk" not in names or "info.json" not in names:
                  raise SystemExit("Downloaded target does not have the expected APKM container layout")
          print("Target APKM archive structure verified")
          PY
          sha256sum "$target"
          echo "PINTEREST_TARGET=$target" >> "$GITHUB_ENV"

      - name: Apply Pinterest patches to target and validate output
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/reseam/rj-reseam-patches.reseam"
          pubkey="$(python -c 'import sys,zipfile; print(zipfile.ZipFile(sys.argv[1]).read("manifest.pubkey").hex())' "$bundle")"
          output="$RUNNER_TEMP/patched-pinterest-14.42.0"
          "$RESEAM_BIN" info "$PINTEREST_TARGET"
          "$RESEAM_BIN" patch "$PINTEREST_TARGET" --bundle "$bundle" --trust "$pubkey" --output-dir "$output" --enable app.rj.pinterest.patches.removeAdvertisingIdPermission --enable app.rj.pinterest.patches.optOutGoogleAnalytics --enable app.rj.pinterest.patches.disablePrivacySandboxAdServices --enable app.rj.pinterest.patches.disableGoogleEngageReceiver
          test -s "$output/base.apk"
          "$RESEAM_BIN" info "$output/base.apk"
          echo "Patched APK set created at $output"

      - name: Preserve diagnostics when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reseam-build-outputs
          path: |
            build/reports/
            build/reseam/
          if-no-files-found: ignore
          retention-days: 7
