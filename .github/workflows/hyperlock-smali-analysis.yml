name: inspect-hyperlock-smali

on:
  push:
    branches: [work/hyperlock-analysis]
    paths:
      - ".github/workflows/hyperlock-smali-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hyperlock-analysis
      - name: Download and verify HyperLock archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/visionxstream99-mod/RJ-reseam-patches/releases/download/apk/HyperLock-Screen-AOD_0.1.2_apkcube.zip"
          curl -fL --retry 2 "$url" -o "$RUNNER_TEMP/hyperlock.zip"
          echo "63aec7722410be0f3eb00fbdc54f54df2b986777de2cdd1d482c759ade02876b  $RUNNER_TEMP/hyperlock.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hyperlock-input"
          unzip -q "$RUNNER_TEMP/hyperlock.zip" -d "$RUNNER_TEMP/hyperlock-input"
      - name: Inspect app activities and banner widget methods
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hyperlock-input/HyperLock-Screen-AOD_0.1.2_apkcube" analysis/hyperlock-ad-focused.md <<'PY'
          import re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          app = root / "smali/com/appiolab/hyperlock_screen_and_aod"
          files = sorted(app.rglob("*.smali")) if app.exists() else []
          paths = [
              "Activitys/MainActivity.smali",
              "Activitys/SplashActivity.smali",
              "Activitys/SettingActivity.smali",
              "Activitys/AllImagesSeeActivity.smali",
              "Activitys/BuyPremiumActivity.smali",
              "Activitys/ThankYouActivity.smali",
          ]
          wanted = [
              root / "smali/com/applovin/mediation/BannerAdLayout.smali",
              root / "smali_classes2/com/applovin/mediation/BannerAdLayout.smali",
              root / "smali/com/applovin/mediation/MaxAdView.smali",
              root / "smali_classes2/com/applovin/mediation/MaxAdView.smali",
          ]
          wanted += [app / p for p in paths]
          wanted = [p for p in wanted if p.exists()]
          all_smali = sorted(p for p in root.glob("smali*/**/*.smali") if p.is_file())
          lines = [
              "HyperLock 0.1.2 — focused ad-path inspection", "",
              "Package: com.appiolab.hyperlockscreenos",
              "App code namespace: com.appiolab.hyperlock_screen_and_aod",
              "App namespace Smali files: {}".format(len(files)),
              "All Smali files: {}".format(len(all_smali)),
              "",
              "## Focused classes and methods",
              ""
          ]
          term = re.compile(
              r'BannerAdLayout|MaxAdView|Lcom/google/android/gms/ads/AdView;|'
              r'Lcom/google/android/gms/ads/interstitial/InterstitialAd;|'
              r'Lcom/google/android/gms/ads/rewarded/RewardedAd;|'
              r'AdRequest;|MobileAds;|loadAd\(|show\(|bannerAd|setContentView|'
              r'R\$layout;|La5;->bind|La\\w+;->bind|premium|admob|interstitial|ads',
              re.I)
          for p in wanted:
              txt = p.read_text(errors="ignore").splitlines()
              cls = next((x.strip() for x in txt if x.strip().startswith(".class ")), "")
              lines.append("### {}".format(p.relative_to(root)))
              lines.append("Class: {}".format(cls))
              current = "(outside method)"
              selected = []
              for n, line in enumerate(txt, 1):
                  if line.strip().startswith(".method "):
                      current = line.strip()
                  if term.search(line):
                      lo, hi = max(0, n-3), min(len(txt), n+2)
                      selected.append((n, current, " | ".join(x.strip() for x in txt[lo:hi])))
              if not selected:
                  lines.append("No focused ad/layout method matches.")
              for n, method, snippet in selected[:100]:
                  lines.append("Line {} | {}".format(n, method))
                  lines.append("  {}".format(snippet[:420]))
              lines.append("")
          lines += ["## All non-SDK classes referring to the AppLovin banner widget", ""]
          count = 0
          for p in all_smali:
              rel = p.relative_to(root).as_posix()
              if "/com/applovin/" in "/" + rel or "/com/google/android/gms/ads/" in "/" + rel:
                  continue
              txt = p.read_text(errors="ignore").splitlines()
              refs = []
              current = "(outside method)"
              for n, line in enumerate(txt, 1):
                  if line.strip().startswith(".method "):
                      current = line.strip()
                  if "Lcom/applovin/mediation/BannerAdLayout;" in line or "BannerAdLayout;->" in line:
                      refs.append((n, current, line.strip()))
              if refs:
                  cls = next((x.strip() for x in txt if x.strip().startswith(".class ")), "")
                  lines.append("{} ({})".format(cls, rel))
                  for n, method, snippet in refs[:25]:
                      lines.append("  Line {} | {}".format(n, method))
                      lines.append("    {}".format(snippet[:300]))
                      count += 1
                  lines.append("")
          if count == 0:
              lines.append("No direct banner-widget field/invoke references found outside SDK files.")
          lines += ["", "## Exact ad SDK calls from non-SDK classes", ""]
          callpat = re.compile(
              r'invoke-\\S+.*Lcom/google/android/gms/ads/(?:AdView;->|interstitial/InterstitialAd;->|rewarded/RewardedAd;->|AdLoader;->|MobileAds;->)|'
              r'invoke-\\S+.*Lcom/applovin/mediation/BannerAdLayout;->|'
              r'invoke-\\S+.*Lcom/applovin/mediation/MaxAdView;->|'
              r'invoke-\\S+.*Lcom/applovin/mediation/MaxInterstitialAd;->',
              re.I)
          direct = 0
          for p in all_smali:
              rel = p.relative_to(root).as_posix()
              if "/com/applovin/" in "/" + rel or "/com/google/android/gms/ads/" in "/" + rel:
                  continue
              txt = p.read_text(errors="ignore").splitlines()
              current = "(outside method)"
              selected = []
              for n, line in enumerate(txt, 1):
                  if line.strip().startswith(".method "):
                      current = line.strip()
                  if callpat.search(line):
                      selected.append((n, current, line.strip()))
              if selected:
                  cls = next((x.strip() for x in txt if x.strip().startswith(".class ")), "")
                  lines.append("{} ({})".format(cls, rel))
                  for n, method, snippet in selected[:20]:
                      lines.append("  Line {} | {}".format(n, method))
                      lines.append("    {}".format(snippet[:300]))
                      direct += 1
                  lines.append("")
          if direct == 0:
              lines.append("No literal public API ad-load/show calls matched; see focused class output for bindings and widget setup.")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text("\n".join(lines) + "\n")
          print("Wrote focused report: {} bytes".format(output.stat().st_size))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/hyperlock-ad-focused.md
          git commit -m "chore: inspect HyperLock banner and interstitial hooks [skip ci]"
          git push origin "HEAD:work/hyperlock-analysis"
