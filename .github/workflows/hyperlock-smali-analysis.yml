name: inspect-hyperlock-smali

on:
  push:
    branches: [work/hyperlock-analysis]
    paths:
      - ".github/workflows/hyperlock-smali-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hyperlock-analysis
      - name: Download and verify HyperLock archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/visionxstream99-mod/RJ-reseam-patches/releases/download/apk/HyperLock-Screen-AOD_0.1.2_apkcube.zip"
          curl -fL --retry 2 "$url" -o "$RUNNER_TEMP/hyperlock.zip"
          echo "63aec7722410be0f3eb00fbdc54f54df2b986777de2cdd1d482c759ade02876b  $RUNNER_TEMP/hyperlock.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hyperlock-input"
          unzip -q "$RUNNER_TEMP/hyperlock.zip" -d "$RUNNER_TEMP/hyperlock-input"
      - name: Inspect interstitial manager and caller methods
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hyperlock-input/HyperLock-Screen-AOD_0.1.2_apkcube" analysis/hyperlock-interstitial-inspection.md <<'PY'
          import re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          smali_files = sorted(p for p in root.glob("smali*/**/*.smali") if p.is_file())
          wanted = [p for p in smali_files if p.name.startswith("InterstitialAdManager") and "/com/applovin/mediation/" in p.as_posix()]
          lines = ["HyperLock 0.1.2 — interstitial ad path", ""]
          def dump_class(p):
              txt = p.read_text(errors="ignore").splitlines()
              cls = next((x.strip() for x in txt if x.strip().startswith(".class ")), "")
              lines.append("## {} ({})".format(cls, p.relative_to(root)))
              current = "(outside method)"
              capture = False
              body = []
              blocks = []
              for n, line in enumerate(txt, 1):
                  if line.strip().startswith(".method "):
                      if capture and body:
                          blocks.append(body)
                      current = line.strip()
                      body = [(n, line)]
                      capture = bool(re.search(r'load|show|ready|display|interstitial|present|ad\b', current, re.I))
                  elif body:
                      body.append((n, line))
                  if line.strip() == ".end method":
                      if capture and body:
                          blocks.append(body)
                      body = []
                      capture = False
                      current = "(outside method)"
              for block in blocks:
                  for n, line in block:
                      if any(k in line.lower() for k in ["invoke-", "method ", "return", "const-string", "iget", "iput", "if-"]):
                          lines.append("{}: {}".format(n, line.strip()[:260]))
                  lines.append("")
          if wanted:
              for p in wanted:
                  dump_class(p)
          else:
              lines.append("No InterstitialAdManager class with that exact name found.")
          lines += ["", "## HyperLock caller methods referencing the interstitial manager or ad unit keys", ""]
          hits = 0
          for p in smali_files:
              if "/com/appiolab/hyperlock_screen_and_aod/" not in p.as_posix():
                  continue
              txt = p.read_text(errors="ignore").splitlines()
              cls = next((x.strip() for x in txt if x.strip().startswith(".class ")), "")
              current = "(outside method)"
              for i, line in enumerate(txt):
                  if line.strip().startswith(".method "):
                      current = line.strip()
                  if re.search(r'InterstitialAdManager|getAdmobInterstitialCommonAdUnit|showAd|loadAd', line, re.I):
                      lines.append("{} | {} | line {}: {}".format(cls, current, i+1, line.strip()[:280]))
                      for j in range(max(0, i-2), min(len(txt), i+3)):
                          if j != i:
                              lines.append("  {}".format(txt[j].strip()[:240]))
                      lines.append("")
                      hits += 1
                      if hits >= 120:
                          break
              if hits >= 120:
                  break
          if hits == 0:
              lines.append("No app-owned interstitial manager references found.")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text("\n".join(lines) + "\n")
          print("Wrote {} ({} bytes)".format(output, output.stat().st_size))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/hyperlock-interstitial-inspection.md
          git commit -m "chore: inspect HyperLock interstitial methods [skip ci]"
          git push origin "HEAD:work/hyperlock-analysis"
