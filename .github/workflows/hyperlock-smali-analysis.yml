name: inspect-hyperlock-smali

on:
  push:
    branches: [work/hyperlock-analysis]
    paths:
      - ".github/workflows/hyperlock-smali-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hyperlock-analysis
      - name: Download and verify HyperLock archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/visionxstream99-mod/RJ-reseam-patches/releases/download/apk/HyperLock-Screen-AOD_0.1.2_apkcube.zip"
          curl -fL --retry 2 "$url" -o "$RUNNER_TEMP/hyperlock.zip"
          echo "63aec7722410be0f3eb00fbdc54f54df2b986777de2cdd1d482c759ade02876b  $RUNNER_TEMP/hyperlock.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hyperlock-input"
          unzip -q "$RUNNER_TEMP/hyperlock.zip" -d "$RUNNER_TEMP/hyperlock-input"
      - name: Map manifest components and find ad call sites
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hyperlock-input/HyperLock-Screen-AOD_0.1.2_apkcube" analysis/hyperlock-smali-findings.md <<'PY'
          import collections, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          manifest_path = root / "AndroidManifest.xml"
          manifest = manifest_path.read_text(errors="ignore") if manifest_path.exists() else ""
          m = re.search(r'<manifest[^>]*\bpackage="([^"]+)"', manifest)
          pkg = m.group(1) if m else "unknown"
          smali = sorted(p for p in root.glob("smali*/**/*.smali") if p.is_file())
          def desc(p):
              try:
                  t = p.read_text(errors="ignore")
                  m = re.search(r'^\s*\.class\s+.*?\s(L[^;]+;)', t, re.M)
                  return m.group(1) if m else ""
              except Exception:
                  return ""
          class_paths = {desc(p): p for p in smali if desc(p)}
          package_counts = collections.Counter()
          for c in class_paths:
              body = c[1:-1].split("/")
              if body:
                  package_counts["/".join(body[:min(3, len(body)-1)]) if len(body)>1 else body[0]] += 1
          component_names = []
          for line in manifest.splitlines():
              if re.search(r'<(?:activity|activity-alias|service|receiver|provider)\b', line):
                  nam = re.search(r'android:name="([^"]+)"', line)
                  if nam:
                      name = nam.group(1)
                      if name.startswith("."):
                          name = pkg + name
                      elif "." not in name:
                          name = pkg + "." + name
                      component_names.append(name)
          ad_pat = re.compile(
              r'Lcom/google/android/gms/ads/|Lcom/google/ads/|Lcom/applovin/|'
              r'Lcom/facebook/ads/|Lcom/unity3d/ads/|Lcom/ironsource/|'
              r'Lcom/startapp/|Lcom/inmobi/|Lcom/appodeal/|Lcom/chartboost/|'
              r'Lcom/vungle/|BannerAdLayout|MaxAdView|MaxInterstitialAd|'
              r'AppLovinSdk|MobileAds;|AdView;->|InterstitialAd;->|RewardedAd;->|'
              r'NativeAd;->|AdLoader;->|AdRequest;|loadAd\(|show\(',
              re.I)
          str_pat = re.compile(r'const-string.*"(?:[^"]*(?:admob|ads|banner|interstitial|rewarded|premium|sponsor|advert)[^"]*)"', re.I)
          external = (
              "/com/google/android/gms/ads/", "/com/google/ads/", "/com/applovin/",
              "/com/facebook/ads/", "/com/unity3d/ads/", "/com/ironsource/",
              "/com/startapp/", "/com/inmobi/", "/com/appodeal/", "/com/chartboost/", "/com/vungle/"
          )
          lines = [
              "HyperLock 0.1.2 — Smali selector research", "",
              "This report is static selector research, not a patch artifact.",
              "Package: {}".format(pkg),
              "Smali files: {}".format(len(smali)),
              "Class descriptors: {}".format(len(class_paths)),
              "",
              "## Manifest components",
              ""
          ]
          for name in component_names:
              p = class_paths.get("L" + name.replace(".", "/") + ";")
              lines.append("- {}{}".format(name, " — Smali found: {}".format(p.relative_to(root)) if p else " — no exact class file found"))
          lines += ["", "## Most common class package prefixes", ""]
          for name, count in package_counts.most_common(80):
              lines.append("- {}: {}".format(name, count))
          lines += ["", "## Ad-related call sites outside ad SDK implementation packages", ""]
          hits = 0
          class_hits = 0
          for p in smali:
              ps = p.as_posix()
              if any(ext in ps for ext in external):
                  continue
              try:
                  content = p.read_text(errors="ignore").splitlines()
              except Exception:
                  continue
              cls = next((x.strip() for x in content if x.strip().startswith(".class ")), "")
              selected = []
              method = "(outside method)"
              for n, line in enumerate(content, 1):
                  if line.strip().startswith(".method "):
                      method = line.strip()
                  if ad_pat.search(line):
                      selected.append((n, method, line.strip()))
              if selected:
                  class_hits += 1
                  lines.append("Class descriptor: {}".format(cls))
                  lines.append("File: {}".format(p.relative_to(root)))
                  for n, method, snippet in selected[:12]:
                      lines.append("  line {} | {}".format(n, method))
                      lines.append("    {}".format(snippet[:240]))
                      hits += 1
                      if hits >= 350:
                          break
                  lines.append("")
              if hits >= 350:
                  break
          if hits == 0:
              lines.append("No matching call-site references outside SDK packages were found.")
          lines += ["", "## Ad/premium string constants outside SDK packages", ""]
          shits = 0
          for p in smali:
              ps = p.as_posix()
              if any(ext in ps for ext in external):
                  continue
              try:
                  content = p.read_text(errors="ignore").splitlines()
              except Exception:
                  continue
              cls = next((x.strip() for x in content if x.strip().startswith(".class ")), "")
              method = "(outside method)"
              selected = []
              for n, line in enumerate(content, 1):
                  if line.strip().startswith(".method "):
                      method = line.strip()
                  if str_pat.search(line):
                      selected.append((n, method, line.strip()))
              if selected:
                  lines.append("Class descriptor: {}".format(cls))
                  lines.append("File: {}".format(p.relative_to(root)))
                  for n, method, snippet in selected[:8]:
                      lines.append("  line {} | {}".format(n, method))
                      lines.append("    {}".format(snippet[:220]))
                      shits += 1
                      if shits >= 180:
                          break
                  lines.append("")
              if shits >= 180:
                  break
          if shits == 0:
              lines.append("No matching string constants outside SDK packages.")
          lines += ["", "## App layout ids/components related to ads", ""]
          res = root / "res"
          for p in sorted(res.glob("layout/*.xml")):
              try:
                  txt = p.read_text(errors="ignore")
              except Exception:
                  continue
              if re.search(r'bannerAd|BannerAdLayout|AdView|Premium|premium', txt, re.I):
                  lines.append("- {}: {}".format(p.relative_to(root), "; ".join(x.strip()[:180] for x in txt.splitlines() if re.search(r'bannerAd|BannerAdLayout|AdView|Premium|premium', x, re.I))[:700]))
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text("\n".join(lines) + "\n")
          print("Wrote {} ({} bytes); {} smali classes have ad references.".format(output, output.stat().st_size, class_hits))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/hyperlock-smali-findings.md
          git commit -m "chore: map HyperLock ad selectors [skip ci]"
          git push origin "HEAD:work/hyperlock-analysis"
